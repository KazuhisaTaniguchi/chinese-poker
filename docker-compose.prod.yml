services:
  ofc_db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ofc_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: ofc_backend
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      - DB_HOST=ofc_db
      - DB_PORT=5432
    volumes:
      - ./shared/backend_static:/app/staticfiles
      - ./shared/backend_media:/app/media
      - backend_logs:/app/logs
    expose:
      - "8000"
    depends_on:
      ofc_db:
        condition: service_healthy
    networks:
      - default
      - proxy_net

  ofc_frontend_builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    profiles: ["build"]
    volumes:
      - ./shared/frontend_dist:/output

volumes:
  postgres_data:
  backend_logs:

networks:
  proxy_net:
    external: true
