services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/app/logs
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  frontend-builder:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    profiles: ["build"]
    volumes:
      - frontend_dist:/output

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - backend_static:/var/www/backend/staticfiles:ro
      - backend_media:/var/www/backend/media:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :;
             do certbot renew --webroot -w /var/www/certbot --quiet;
                sleep 12h & wait $${!};
             done"

volumes:
  postgres_data:
  backend_static:
  backend_media:
  backend_logs:
  frontend_dist:
  certbot_etc:
  certbot_www:
