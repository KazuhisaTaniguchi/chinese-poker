server {
    listen 80;
    server_name api-ofc.pocket-dealer.jp www.api-ofc.pocket-dealer.jp;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://api-ofc.pocket-dealer.jp$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.api-ofc.pocket-dealer.jp;

    ssl_certificate     /etc/letsencrypt/live/api-ofc.pocket-dealer.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-ofc.pocket-dealer.jp/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;

    return 301 https://api-ofc.pocket-dealer.jp$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api-ofc.pocket-dealer.jp;

    ssl_certificate     /etc/letsencrypt/live/api-ofc.pocket-dealer.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-ofc.pocket-dealer.jp/privkey.pem;
    include /etc/nginx/options-ssl-nginx.conf;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/ofc/static/;
        expires 30d;
    }
    location /media/ {
        alias /var/www/ofc/media/;
        expires 30d;
    }
    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream_ofc http://ofc_backend:8000;
        proxy_pass $upstream_ofc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
