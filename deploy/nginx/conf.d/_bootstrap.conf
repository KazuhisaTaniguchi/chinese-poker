server {
    listen 80;
    server_name api-ofc.pocket-dealer.jp www.api-ofc.pocket-dealer.jp
                ofc.pocket-dealer.jp www.ofc.pocket-dealer.jp;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
